name: settl
description: "Settl — A decentralized crypto-native payment system on Solana"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  # State Management
  hooks_riverpod: ^3.0.0
  flutter_hooks: ^0.21.0

  # Navigation
  go_router: ^14.0.0

  # Blockchain
  solana: ^0.31.0

  # QR Code
  mobile_scanner: ^7.0.0
  qr_flutter: ^4.1.0

  # Animations
  flutter_animate: ^4.5.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.4.0
  path_provider: ^2.1.0
  flutter_secure_storage: ^9.2.0

  # Networking
  connectivity_plus: ^6.0.0
  dio: ^5.7.0

  # UI / Fonts
  google_fonts: ^6.2.0

  # Utilities
  share_plus: ^10.0.0
  uuid: ^4.5.0
  intl: ^0.19.0
  path: ^1.9.1
  url_launcher: ^6.3.2
  bip39: ^1.0.6
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.0
  hive_generator: ^2.0.0
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/splash/
    - assets/icons/
    - assets/data/

flutter_launcher_icons:
  android: true
  ios: true
  image_path_android: "assets/icons/app_icon_android.png"
  image_path_ios: "assets/icons/app_icon_ios.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  windows:
    generate: true
    image_path: "assets/icons/app_icon_windows.png"

flutter_native_splash:
  color: "#ffffff"
  color_dark: "#000000"
  image_android: "assets/splash/splash_android.png"
  image_ios: "assets/splash/splash_ios.png"
  android_12:
    color: "#ffffff"
    color_dark: "#000000"
    image: "assets/splash/splash_android.png"