name: chain_pay
description: "ChainPay — A decentralized crypto-native payment system on Solana"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  # State Management
  hooks_riverpod: ^3.0.0
  flutter_hooks: ^0.21.0

  # Navigation
  go_router: ^14.0.0

  # Blockchain
  solana: ^0.31.0

  # QR Code
  mobile_scanner: ^7.0.0
  qr_flutter: ^4.1.0

  # Animations
  flutter_animate: ^4.5.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.4.0
  path_provider: ^2.1.0
  flutter_secure_storage: ^9.2.0

  # Networking
  connectivity_plus: ^6.0.0
  dio: ^5.7.0

  # UI / Fonts
  google_fonts: ^6.2.0

  # Utilities
  share_plus: ^10.0.0
  uuid: ^4.5.0
  intl: ^0.19.0
  path: ^1.9.1
  url_launcher: ^6.3.2
  bip39: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.0
  hive_generator: ^2.0.0
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
